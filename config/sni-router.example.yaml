# TCP TLS passthrough with explicit defaults.
# Replace the example names and upstream addresses before running.
# Reference: docs/configuration.md. More scenarios: config/examples/.
# Validate without binding ports: sni-router -t /path/to/this-file.yaml

listeners:
  - name: tls
    bind: ["0.0.0.0:443", "[::]:443"]
    proto: tcp
    backlog: 1024
    fast_open: false
    # fast_open_qlen: 1024      # TCP Fast Open pending queue, if enabled
    routes:                   # first match wins
      - sni: "example.com"
        backend: web
      - sni: "*.example.com"   # any subdomain depth; excludes the apex
        backend: web
      # No catch-all: unrecognised names and non-TLS connections are rejected.
      # Add a final sni: "*" route only when a fallback is intended.
    # acl:
    #   allow_ip: ["192.0.2.0/24", "2001:db8::/32"]
    #   deny_ip: ["192.0.2.10"]
    #   allow_sni: ["example.com", "*.example.com"]
    #   deny_sni: ["blocked.example.com"]

backends:
  web:
    mode: passthrough
    proxy_protocol: none       # enable v1/v2 only if the upstream expects it
    balance: round_robin
    health_check: true         # TCP connect probes, not application checks
    fast_open: false
    servers: ["127.0.0.1:8443", "127.0.0.1:9443"]

# Seconds. These are the defaults, not a single end-to-end request deadline.
timeouts:
  handshake: 5                 # each read while collecting TCP ClientHello
  connect: 10                  # each backend connect attempt
  idle: 300                    # HTTP/1.1 reads, TLS/h2 handshakes, QUIC expiry
  udp_idle: 30                 # plain-UDP flow expiry; not used by QUIC
  keepalive: 60                # TCP keepalive idle time; 0 disables it
  health_interval: 10
  drain: 30                    # shutdown wait for active TCP connections

limits:
  max_client_hello: 16384       # bytes, TCP ClientHello buffer
  max_conns_per_ip: 0           # concurrent TCP connections; 0 means unlimited

# Optional data-path settings. Changing them restarts the process on reload.
runtime:
  io_uring_entries: 4096        # submission queue entries per worker
  splice_chunk: 65536           # bytes per move; never waits for a full chunk
  pipe_size: 65536              # requested bytes per pipe; 0 uses kernel default
  splice_spin: 8                # rounds before yielding to other tasks

# Each TCP passthrough connection uses two pipes. Their pages share the
# service user's fs.pipe-user-pages-soft budget. Check validation warnings
# before increasing pipe_size; see docs/configuration.md for the calculation.

log:
  level: info
  format: text

# Optional management and metrics API. Use a unique token, not this placeholder.
# Read and write requests require the token; GET /config omits it.
# Without api.tls or default_tls this uses HTTP, so keep it on a trusted network.
# api:
#   bind: "127.0.0.1:9000"
#   token: "replace-with-a-random-token"

# Termination examples with certificate settings are separate, complete files:
# config/examples/https-termination.yaml
# config/examples/tls-tcp.yaml
# config/examples/backend-tls.yaml
#
# After editing a running installation:
#   sudo sni-router -t && sudo systemctl reload sni-router
# Route-only edits hot-swap. Listener/runtime/TLS-setting edits may re-exec
# the process and disconnect clients. See docs/operations.md before applying.
